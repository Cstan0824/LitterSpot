name: LitterSpot CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  node:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Firebase Emulator now requires Java 21+
      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - run: npm ci
      - run: npm --workspace=backend run test
      - run: npm --workspace=backend run build
      - run: npm --workspace=frontend run build
      - run: npm run test:emulator

  python:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r ai-service/requirements.txt
      - run: PYTHONDONTWRITEBYTECODE=1 python -m unittest discover -s ai-service/tests -p 'test_*.py'