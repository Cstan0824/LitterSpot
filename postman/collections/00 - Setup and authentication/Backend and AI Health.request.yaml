$kind: http-request
name: Backend and AI Health
description: Public generic readiness check. It intentionally reports dependency readiness without exposing model paths, versions, devices, or other internals.
url: "{{baseUrl}}/api/health/ready"
method: GET
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      pm.test('Node responds successfully', () => pm.response.to.have.status(200));
      pm.test('Generic AI readiness is present without model internals', () => {
        const result = pm.response.json();
        pm.expect(result).to.eql({ status: 'ok', dependencies: { aiInference: 'ready' } });
        pm.expect(pm.response.text()).not.to.include('modelVersion');
        pm.expect(pm.response.headers.get('X-Request-ID')).to.be.a('string').and.not.empty;
        pm.expect(pm.response.headers.get('X-Content-Type-Options')).to.eql('nosniff');
      });
    language: text/javascript
order: 1000
