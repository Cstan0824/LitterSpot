$kind: http-request
name: Complete Orchestrator Run
description: Private worker completion. Use completed only after the agent has finished its current foundation step; waiting returns the run to the pending outbox for another claim.
url: "{{baseUrl}}/internal/orchestrator/runs/{{orchestratorRunId}}/complete"
method: POST
headers:
  X-Orchestrator-Token: "{{orchestratorInternalToken}}"
  X-Orchestrator-Worker-ID: "{{orchestratorWorkerId}}"
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "workerId": "{{orchestratorWorkerId}}",
      "claimToken": "{{orchestratorClaimToken}}",
      "status": "completed",
      "result": { "postmanSmoke": true }
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Run completes with the active claim', () => pm.response.to.have.status(200));
      if (pm.response.code === 200) pm.expect(pm.response.json().run.status).to.eql('completed');
    language: text/javascript
order: 1070
