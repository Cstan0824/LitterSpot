$kind: http-request
name: Recover Expired Orchestrator Runs
description: Supervisor-only recovery command for expired worker leases. Safe to replay; it only requeues runs whose leases have expired.
url: "{{baseUrl}}/api/orchestrator/recover"
method: POST
headers:
  Authorization: "Bearer {{firebaseIdToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('Expired runs are scanned', () => pm.response.to.have.status(200));
      if (pm.response.code === 200) pm.expect(pm.response.json().recovered).to.be.a('number');
    language: text/javascript
order: 1080
