$kind: http-request
name: List Orchestrator Runs
description: Supervisor read-only view of durable orchestrator runs.
url: "{{baseUrl}}/api/orchestrator/runs?status=all&limit=25"
method: GET
headers:
  Authorization: "Bearer {{firebaseIdToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('Orchestrator run list is readable', () => pm.response.to.have.status(200));
      if (pm.response.code === 200) pm.expect(pm.response.json().runs).to.be.an('array');
    language: text/javascript
order: 1010
