$kind: http-request
name: Ensure Orchestrator Run
description: Supervisor-only, idempotent trigger for an active alert. Normal production alert creation creates this automatically; this request is useful for replaying or seeding a Phase 12 run during integration testing.
url: "{{baseUrl}}/api/orchestrator/runs/ensure"
method: POST
headers:
  Authorization: "Bearer {{firebaseIdToken}}"
  Content-Type: application/json
body:
  type: json
  content: |-
    { "alertId": "{{alertId}}" }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Orchestrator run is created or reused', () => pm.expect([200, 201]).to.include(pm.response.code));
      if ([200, 201].includes(pm.response.code)) {
        const result = pm.response.json();
        pm.expect(result.run.alertId).to.eql(pm.environment.get('alertId'));
        pm.environment.set('orchestratorRunId', result.run.id);
        pm.variables.set('orchestratorRunId', result.run.id);
      }
    language: text/javascript
order: 1000
