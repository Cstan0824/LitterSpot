$kind: http-request
name: Record Orchestrator Decision
description: Private idempotent audit record for an agent tool call. This request does not mutate application state.
url: "{{baseUrl}}/internal/orchestrator/runs/{{orchestratorRunId}}/decisions"
method: POST
headers:
  X-Orchestrator-Token: "{{orchestratorInternalToken}}"
  X-Orchestrator-Worker-ID: "{{orchestratorWorkerId}}"
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "claimToken": "{{orchestratorClaimToken}}",
      "actionId": "{{orchestratorDecisionId}}",
      "toolName": "get_alert_context",
      "outcome": "succeeded",
      "input": { "alertId": "{{alertId}}" },
      "result": { "contextRead": true },
      "rationale": "Context was loaded before assignment planning.",
      "idempotencyKey": "{{orchestratorDecisionId}}"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Decision is recorded or replayed safely', () => pm.expect([200, 201]).to.include(pm.response.code));
      if ([200, 201].includes(pm.response.code)) pm.expect(pm.response.json().decisionId).to.be.a('string');
    language: text/javascript
order: 1060
