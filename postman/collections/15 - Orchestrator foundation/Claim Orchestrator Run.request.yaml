$kind: http-request
name: Claim Orchestrator Run
description: Private worker lease claim. Run Ensure Orchestrator Run first and use the saved orchestratorRunId.
url: "{{baseUrl}}/internal/orchestrator/runs/{{orchestratorRunId}}/claim"
method: POST
headers:
  X-Orchestrator-Token: "{{orchestratorInternalToken}}"
  X-Orchestrator-Worker-ID: "{{orchestratorWorkerId}}"
  Content-Type: application/json
body:
  type: json
  content: |-
    { "workerId": "{{orchestratorWorkerId}}", "leaseSeconds": 300 }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Run is claimed', () => pm.response.to.have.status(200));
      if (pm.response.code === 200) {
        const result = pm.response.json();
        pm.expect(result.run.status).to.eql('running');
        pm.environment.set('orchestratorClaimToken', result.claimToken);
        pm.variables.set('orchestratorClaimToken', result.claimToken);
      }
    language: text/javascript
order: 1030
