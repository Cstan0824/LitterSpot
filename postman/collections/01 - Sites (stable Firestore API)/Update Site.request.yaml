$kind: http-request
url: "{{baseUrl}}/api/sites/{{siteId}}"
method: PATCH
headers:
  Authorization: "Bearer {{firebaseIdToken}}"
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "description": "Updated through Postman"
    }
scripts:
  - type: afterResponse
    code: pm.test('Site updated', () => pm.response.to.have.status(200));
    language: text/javascript
order: 4000
