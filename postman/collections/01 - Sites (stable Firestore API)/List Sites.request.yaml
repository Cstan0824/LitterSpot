$kind: http-request
url: "{{baseUrl}}/api/sites?status=all"
method: GET
headers:
  Authorization: "Bearer {{firebaseIdToken}}"
queryParams:
  status: all
scripts:
  - type: afterResponse
    code: |-
      pm.test('Sites returned', () => pm.response.to.have.status(200));
      pm.test('Response contains an array', () => pm.expect(pm.response.json().sites).to.be.an('array'));
    language: text/javascript
order: 1000
