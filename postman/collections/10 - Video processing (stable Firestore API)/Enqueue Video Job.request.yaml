$kind: http-request
description: >-
  Add the selected queued video job to Node's concurrency-one in-process worker.
  The 202 response acknowledges queueing; it is not the completed inference
  result. Run Poll Video Job until a terminal status appears.
url: "{{baseUrl}}/api/processing-jobs/{{processingJobId}}/process"
method: POST
headers:
  Authorization: "Bearer {{firebaseIdToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('Video process request accepted', () => pm.response.to.have.status(202));
      if (pm.response.code === 202) {
        const result = pm.response.json();
        pm.test('Video queue acknowledgement returned', () => {
          pm.expect(result.processingJob.type).to.eql('video');
          pm.expect(['queued', 'processing', 'completed']).to.include(result.processingJob.status);
          pm.expect(result.enqueued).to.be.a('boolean');
        });
      }
    language: text/javascript
order: 3000
