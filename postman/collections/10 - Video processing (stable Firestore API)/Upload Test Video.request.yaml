$kind: http-request
name: Upload Test Video
description: "Stream a genuine MP4 or WebM to Node's local media store. Test mode is the default: sampled results and grouped metrics remain inspectable, but they do not feed confirmation, flags, alerts, or analytics. Change the checked-in clientRequestId text before an intentional new upload; reusing it with the same Camera and file exercises idempotency."
url: "{{baseUrl}}/api/media/videos"
method: POST
headers:
  Authorization: Bearer {{firebaseIdToken}}
body:
  type: formdata
  content:
    - type: file
      key: video
      src: []
      disabled: false
    - type: text
      key: cameraId
      value: "{{cameraId}}"
      disabled: false
    - type: text
      key: clientRequestId
      value: postman-video-001
      disabled: false
    - type: text
      key: isTest
      value: "true"
      disabled: false
    - type: text
      key: frameIntervalSeconds
      value: "2"
      disabled: false
    - type: text
      key: floorConfidence
      value: "0.25"
      disabled: false
    - type: text
      key: binLocalizerConfidence
      value: "0.80"
      disabled: false
scripts:
  - type: afterResponse
    code: |-
      pm.test('Test video created or reused', () => pm.expect([200, 201]).to.include(pm.response.code));
      if ([200, 201].includes(pm.response.code)) {
        const result = pm.response.json();
        pm.test('Video media and queued job returned', () => {
          pm.expect(result.media.sourceType).to.eql('video_upload');
          pm.expect(result.media.durationSeconds).to.be.a('number').and.above(0);
          pm.expect(result.media.isTest).to.eql(true);
          pm.expect(result.job.type).to.eql('video');
          pm.expect(result.job.isTest).to.eql(true);
          pm.expect(result.job.analyticsEligible).to.eql(false);
          pm.expect(result.job.progress.plannedFrames).to.be.a('number').and.above(0);
          pm.expect(['queued', 'processing', 'completed', 'failed']).to.include(result.job.status);
          pm.expect(result.idempotent).to.be.a('boolean');
        });
        pm.environment.set('mediaId', result.media.id);
        pm.environment.set('processingJobId', result.job.id);
      }
    language: text/javascript
order: 1000
