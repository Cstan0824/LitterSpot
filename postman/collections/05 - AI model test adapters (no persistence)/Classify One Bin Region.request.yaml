$kind: http-request
description: Isolated classifier test adapter through Node. Choose a tightly cropped bin image or use autoLocate. Results are not persisted as application data.
url: "{{baseUrl}}/api/detections/bin-state"
method: POST
headers:
  Authorization: "Bearer {{firebaseIdToken}}"
body:
  type: formdata
  content:
    - type: file
      key: image
      src: []
    - type: text
      key: autoLocate
      value: "true"
    - type: text
      key: confirmationFrames
      value: "1"
scripts:
  - type: afterResponse
    code: pm.test('Bin state classified', () => pm.response.to.have.status(200));
    language: text/javascript
order: 2000
