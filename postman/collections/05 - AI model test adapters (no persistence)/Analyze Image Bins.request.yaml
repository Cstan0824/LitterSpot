$kind: http-request
description: Isolated model-test adapter through Node. Select one or more images under the same images key; maximum ten. Results are not persisted as media, jobs, runs, detections, flags, alerts, or analytics.
url: "{{baseUrl}}/api/detections/bin-state/batch"
method: POST
headers:
  Authorization: "Bearer {{firebaseIdToken}}"
body:
  type: formdata
  content:
    - type: file
      key: images
      src: []
    - type: text
      key: localizerConfidence
      value: "0.80"
    - type: text
      key: maxBins
      value: "10"
    - type: text
      key: confirmationFrames
      value: "1"
scripts:
  - type: afterResponse
    code: pm.test('Images analyzed', () => pm.response.to.have.status(200));
    language: text/javascript
order: 3000
