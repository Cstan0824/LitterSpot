$kind: http-request
name: Cleaner - Go Online with Location
description: Cleaner-only consented browser-geolocation heartbeat. Reusing cleanerHeartbeatId is idempotent. Change it for a new measurement. The server derives freshness and retains detailed history for seven days.
url: "{{baseUrl}}/api/cleaner/presence"
method: PUT
headers:
  Authorization: "Bearer {{cleanerFirebaseIdToken}}"
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "availability": "online",
      "locationConsent": true,
      "clientHeartbeatId": "{{cleanerHeartbeatId}}",
      "location": {
        "latitude": 3.2379,
        "longitude": 101.6840,
        "accuracyMeters": 15,
        "capturedAt": "{{cleanerCapturedAt}}",
        "source": "browser_geolocation"
      }
    }
scripts:
  - type: beforeRequest
    code: |-
      pm.environment.set('cleanerCapturedAt', new Date().toISOString());
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test('Cleaner is online with a fresh location', () => pm.response.to.have.status(200));
      if (pm.response.code === 200) {
        const presence = pm.response.json().presence;
        pm.expect(presence.availability).to.eql('online');
        pm.expect(presence.locationStatus).to.eql('fresh');
        pm.expect(presence.locationConsent).to.eql(true);
      }
    language: text/javascript
order: 5000
