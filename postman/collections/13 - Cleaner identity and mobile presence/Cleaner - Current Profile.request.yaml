$kind: http-request
name: Cleaner - Current Profile
description: Cleaner-only self profile. It never exposes other Cleaners, cameras, dashboards, or Supervisor APIs.
url: "{{baseUrl}}/api/cleaner/me"
method: GET
headers:
  Authorization: "Bearer {{cleanerFirebaseIdToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('Cleaner profile returned', () => pm.response.to.have.status(200));
      if (pm.response.code === 200) {
        const cleaner = pm.response.json().cleaner;
        pm.expect(cleaner.id).to.eql(pm.environment.get('cleanerId'));
        pm.expect(cleaner.accountStatus).to.eql('active');
      }
    language: text/javascript
order: 4000
