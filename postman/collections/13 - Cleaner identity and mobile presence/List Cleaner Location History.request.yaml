$kind: http-request
name: List Cleaner Location History
description: Supervisor-only bounded location history. The mobile Cleaner cannot list this collection. Retention is seven days and execution is handled by the administrative location-retention command.
url: "{{baseUrl}}/api/cleaners/{{cleanerId}}/locations?limit=25"
method: GET
headers:
  Authorization: "Bearer {{firebaseIdToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('Bounded Cleaner location history returned', () => pm.response.to.have.status(200));
      if (pm.response.code === 200) {
        const result = pm.response.json();
        pm.expect(result.locations).to.be.an('array');
        pm.expect(result.locations.length).to.be.at.most(25);
        pm.expect(result.nextCursor === null || typeof result.nextCursor === 'string').to.eql(true);
      }
    language: text/javascript
order: 7000
