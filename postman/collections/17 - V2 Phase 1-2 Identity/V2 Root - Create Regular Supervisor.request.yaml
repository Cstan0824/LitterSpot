$kind: http-request
name: V2 Root - Create Regular Supervisor
url: "{{baseUrl}}/api/supervisors"
method: POST
headers:
  Authorization: "Bearer {{v2RootToken}}"
  Content-Type: application/json
auth:
  type: noauth
body:
  type: json
  content: |-
    {
      "email": "{{v2RegularSupervisorEmail}}",
      "password": "{{v2RegularSupervisorPassword}}",
      "fullName": "Regular Supervisor",
      "phone": null,
      "idempotencyKey": "postman-v2-regular-001"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Regular Supervisor created or replayed', () => pm.expect(pm.response.code).to.be.oneOf([200, 201]));
      if ([200, 201].includes(pm.response.code)) pm.environment.set('v2RegularSupervisorId', pm.response.json().supervisor.uid);
    language: text/javascript
order: 6000
