$kind: http-request
name: V2 Regular Supervisor - Root Audit Forbidden
description: Read-only authorization check. A Regular Supervisor must not access the Root-only Site audit view.
url: "{{baseUrl}}/api/operations/v2/audit-events"
method: GET
headers:
  Authorization: "Bearer {{v2RegularSupervisorToken}}"
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      pm.test('Regular Supervisor is blocked from Root-only audit events', () => {
        const body = pm.response.json();
        pm.response.to.have.status(403);
        pm.expect(body.error).to.eql('Root Supervisor access is required.');
      });
    language: text/javascript
order: 9000
