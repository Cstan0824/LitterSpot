$kind: http-request
name: V2 Root - Phase 11 Daily List
url: "{{baseUrl}}/api/analytics/v2/daily?from=2026-08-29&to=2026-08-31"
method: GET
headers:
  Authorization: "Bearer {{v2RootToken}}"
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      pm.test('Daily list succeeds', () => pm.response.to.have.status(200));
      pm.expect(pm.response.json().summaries).to.be.an('array');
    language: text/javascript
order: 4000
