$kind: http-request
name: V2 Root - Phase 11 Bin Placement Refresh
url: "{{baseUrl}}/api/bin-placement/v2/recommendations/refresh"
method: POST
headers:
  Authorization: "Bearer {{v2RootToken}}"
  Content-Type: application/json
body:
  type: json
  content: '{"days":30}'
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      pm.test('Bin Placement refresh succeeds', () => pm.response.to.have.status(201));
      const snapshot = pm.response.json().snapshot;
      pm.expect(snapshot.siteId).to.eql(pm.environment.get('v2SiteId'));
      pm.expect(snapshot.zoneRankings).to.be.an('array');
      const eligible = snapshot.zoneRankings.find(z => z.totalScore !== null && z.coverage.availableDays >= 2);
      if (eligible) pm.environment.set('v2BinPlacementZoneId', eligible.zoneId); else pm.environment.unset('v2BinPlacementZoneId');
      pm.environment.set('v2BinPlacementSnapshotAt', snapshot.calculatedAt);
    language: text/javascript
order: 5000
