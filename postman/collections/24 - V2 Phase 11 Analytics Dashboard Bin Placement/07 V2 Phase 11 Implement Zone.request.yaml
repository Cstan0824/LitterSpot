$kind: http-request
name: V2 Root - Phase 11 Implement Zone
url: "{{baseUrl}}/api/bin-placement/v2/zones/{{v2BinPlacementZoneId}}/implement"
method: POST
headers:
  Authorization: "Bearer {{v2RootToken}}"
  Content-Type: application/json
body:
  type: json
  content: '{"note":"Phase 11 Postman implementation test","snapshotCalculatedAt":"{{v2BinPlacementSnapshotAt}}"}'
auth:
  type: noauth
scripts:
  - type: beforeRequest
    code: |-
      if (!pm.environment.get("v2BinPlacementZoneId") || !pm.environment.get("v2BinPlacementSnapshotAt")) throw new Error("Run request 05 after two completed observed days exist. Do not implement an insufficient-data row.");
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test('Zone implementation succeeds', () => pm.response.to.have.status(201));
      const intervention = pm.response.json().intervention;
      pm.expect(intervention.zoneId).to.eql(pm.environment.get('v2BinPlacementZoneId'));
      pm.environment.set('v2BinPlacementInterventionId', intervention.interventionId);
    language: text/javascript
order: 7000
