$kind: http-request
name: V2 Root - Phase 11 Intervention Comparison
url: "{{baseUrl}}/api/bin-placement/v2/interventions/{{v2BinPlacementInterventionId}}/comparison?days=7"
method: GET
headers:
  Authorization: "Bearer {{v2RootToken}}"
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      pm.test('Intervention comparison succeeds', () => pm.response.to.have.status(200));
      const comparison = pm.response.json().comparison;
      pm.expect(comparison.before).to.have.property('availableDays');
      pm.expect(comparison.after).to.have.property('availableDays');
    language: text/javascript
order: 9000
