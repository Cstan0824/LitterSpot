$kind: http-request
name: V2 Root - Phase 11 Daily Rebuild
url: "{{baseUrl}}/api/analytics/v2/daily/rebuild"
method: POST
headers:
  Authorization: "Bearer {{v2RootToken}}"
  Content-Type: application/json
body:
  type: json
  content: |-
    {"dates":["2026-08-29","2026-08-30","2026-08-31"]}
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      pm.test('Daily rebuild succeeds', () => pm.response.to.have.status(200));
      const summaries = pm.response.json().summaries;
      pm.expect(summaries).to.be.an('array').and.to.have.length(3);
      pm.expect(summaries[0]).to.have.property('siteId');
      pm.expect(summaries[0]).to.have.property('coverage');
    language: text/javascript
order: 3000
