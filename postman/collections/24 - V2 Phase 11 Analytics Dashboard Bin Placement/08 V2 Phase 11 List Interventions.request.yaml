$kind: http-request
name: V2 Root - Phase 11 List Interventions
url: "{{baseUrl}}/api/bin-placement/v2/interventions"
method: GET
headers:
  Authorization: "Bearer {{v2RootToken}}"
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      pm.test('Intervention list succeeds', () => pm.response.to.have.status(200));
      pm.expect(pm.response.json().interventions).to.be.an('array');
    language: text/javascript
order: 8000
