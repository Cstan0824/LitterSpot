$kind: http-request
description: Get one persisted cleanliness issue detection, including a segmentation polygon capped at 128 points. This needs detectionId from a run that produced an issue.
url: "{{baseUrl}}/api/detections/{{detectionId}}"
method: GET
headers:
  Authorization: "Bearer {{firebaseIdToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('Detection found or no issue was produced', () => pm.expect([200, 404]).to.include(pm.response.code));
      if (pm.response.code === 200) {
        const detection = pm.response.json().detection;
        pm.expect(detection.polygonNormalized.length).to.be.at.most(128);
      }
    language: text/javascript
order: 4000
