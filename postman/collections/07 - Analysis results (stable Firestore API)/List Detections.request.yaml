$kind: http-request
description: List compact cleanliness issue detections for an analysis run. Segmentation polygons are intentionally available only from Get Detection.
url: "{{baseUrl}}/api/detections?analysisRunId={{analysisRunId}}&limit=25"
method: GET
headers:
  Authorization: Bearer {{firebaseIdToken}}
scripts:
  - type: afterResponse
    code: |-
      pm.test('Detections listed', () => pm.response.to.have.status(200));
      if (pm.response.code === 200) {
        const detections = pm.response.json().detections;
        pm.test('List omits heavy polygons', () => detections.forEach(item => pm.expect(item).not.to.have.property('polygonNormalized')));
        if (detections.length) pm.environment.set('detectionId', detections[0].id);
      }
    language: text/javascript
order: 3000
