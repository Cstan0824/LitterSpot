$kind: http-request
description: List Node-owned Firestore analysis runs newest first. Add jobId or cameraId as a query filter when needed; nextCursor continues the exact same filtered query.
url: "{{baseUrl}}/api/analysis-runs?jobId={{processingJobId}}&limit=25"
method: GET
headers:
  Authorization: "Bearer {{firebaseIdToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('Analysis runs listed', () => pm.response.to.have.status(200));
      if (pm.response.code === 200) {
        const result = pm.response.json();
        pm.expect(result.nextCursor === null || typeof result.nextCursor === 'string').to.eql(true);
        if (result.analysisRuns.length) pm.environment.set('analysisRunId', result.analysisRuns[0].id);
      }
    language: text/javascript
order: 1000
