$kind: http-request
description: Get the frontend-ready source media, pinned camera registration, and ordered frame results for one image or video processing job.
url: "{{baseUrl}}/api/processing-jobs/{{processingJobId}}/results"
method: GET
headers:
  Authorization: Bearer {{firebaseIdToken}}
scripts:
  - type: afterResponse
    code: |-
      pm.test('Processing results found', () => pm.response.to.have.status(200));
      if (pm.response.code === 200) {
        const body = pm.response.json();
        pm.expect(body.processingJob.id).to.eql(pm.environment.get('processingJobId'));
        pm.expect(body.sourceMedia.contentUrl).to.be.a('string');
        pm.expect(body.registration.revision).to.be.a('number');
        pm.expect(body.frames).to.be.an('array');
        for (let index = 1; index < body.frames.length; index += 1) {
          pm.expect(body.frames[index].videoOffsetSeconds ?? 0)
            .to.be.at.least(body.frames[index - 1].videoOffsetSeconds ?? 0);
        }
      }
    language: text/javascript
order: 5000
