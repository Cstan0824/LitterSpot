$kind: http-request
description: Get one positive grouped-observation flag and its observation, detection evidence, temporal-confirmation status, and optional alert traceability fields. Run List Flags first; an analysis with no positive grouped condition produces no flag.
url: "{{baseUrl}}/api/flags/{{flagId}}"
method: GET
headers:
  Authorization: "Bearer {{firebaseIdToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('Flag found or selected analysis produced none', () => pm.expect([200, 404]).to.include(pm.response.code));
    language: text/javascript
order: 6000
