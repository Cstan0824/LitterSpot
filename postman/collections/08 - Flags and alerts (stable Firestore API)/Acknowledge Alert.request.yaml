$kind: http-request
description: Move a temporally confirmed New alert to Acknowledged and append Supervisor-attributed status history.
url: "{{baseUrl}}/api/alerts/{{alertId}}/status"
method: PATCH
headers:
  Authorization: "Bearer {{firebaseIdToken}}"
  Content-Type: application/json
body:
  type: json
  content: |-
    { "status": "acknowledged", "note": "Reviewed in Postman" }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Alert acknowledged or already advanced', () => pm.expect([200, 409]).to.include(pm.response.code));
    language: text/javascript
order: 9000
