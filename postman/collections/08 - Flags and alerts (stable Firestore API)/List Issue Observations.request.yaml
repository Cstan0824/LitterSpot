$kind: http-request
description: List the three grouped issue observations produced for the selected analysis run—one each for floor litter, floor spill, and bin overflow. Both positive and negative observations are retained; positive observations may still be awaiting temporal confirmation.
url: "{{baseUrl}}/api/issue-observations?analysisRunId={{analysisRunId}}&limit=25"
method: GET
headers:
  Authorization: "Bearer {{firebaseIdToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('Issue observations listed', () => pm.response.to.have.status(200));
      if (pm.response.code === 200) {
        const observations = pm.response.json().issueObservations;
        pm.test('Grouped observations returned', () => {
          pm.expect(observations).to.be.an('array');
          observations.forEach((observation) => {
            pm.expect(observation).to.include.all.keys(
              'id', 'analysisRunId', 'issueType', 'positive', 'detectionIds',
              'metrics', 'temporalStatus', 'flagId', 'alertId'
            );
          });
        });
        const selected = observations.find((observation) => observation.positive) || observations[0];
        if (selected) {
          pm.environment.set('issueObservationId', selected.id);
          if (selected.flagId) pm.environment.set('flagId', selected.flagId);
          else pm.environment.unset('flagId');
          if (selected.alertId) pm.environment.set('alertId', selected.alertId);
          else pm.environment.unset('alertId');
        } else {
          pm.environment.unset('issueObservationId');
          pm.environment.unset('flagId');
          pm.environment.unset('alertId');
        }
      }
    language: text/javascript
order: 3000
