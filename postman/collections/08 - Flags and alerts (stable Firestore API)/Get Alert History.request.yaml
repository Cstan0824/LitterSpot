$kind: http-request
description: Retrieve chronological, append-only status history for one alert.
url: "{{baseUrl}}/api/alerts/{{alertId}}/history"
method: GET
headers:
  Authorization: "Bearer {{firebaseIdToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('Alert history returned', () => pm.response.to.have.status(200));
    language: text/javascript
order: 12000
