$kind: http-request
description: List internal flags created from positive grouped issue observations in the selected analysis run. A flag can remain pending confirmation with a null alertId until enough observations confirm that the zone is dirty.
url: "{{baseUrl}}/api/flags?analysisRunId={{analysisRunId}}&limit=25"
method: GET
headers:
  Authorization: "Bearer {{firebaseIdToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('Flags listed', () => pm.response.to.have.status(200));
      if (pm.response.code === 200 && pm.response.json().flags.length) {
        const flag = pm.response.json().flags[0];
        pm.environment.set('flagId', flag.id);
        if (flag.observationId) pm.environment.set('issueObservationId', flag.observationId);
        else pm.environment.unset('issueObservationId');
        if (flag.alertId) pm.environment.set('alertId', flag.alertId);
        else pm.environment.unset('alertId');
      } else if (pm.response.code === 200) {
        pm.environment.unset('flagId');
        pm.environment.unset('alertId');
      }
    language: text/javascript
order: 5000
