$kind: http-request
description: Move an alert forward to In Progress. This may skip Acknowledged when the alert is still New.
url: "{{baseUrl}}/api/alerts/{{alertId}}/status"
method: PATCH
headers:
  Authorization: "Bearer {{firebaseIdToken}}"
  Content-Type: application/json
body:
  type: json
  content: |-
    { "status": "in_progress", "note": "Cleaning work started" }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Alert advanced or already advanced', () => pm.expect([200, 409]).to.include(pm.response.code));
    language: text/javascript
order: 10000
