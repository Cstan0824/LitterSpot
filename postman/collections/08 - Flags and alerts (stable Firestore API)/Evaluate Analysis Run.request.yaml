$kind: http-request
description: Idempotently rebuild the three grouped issue observations for an analysis run and apply issue-specific temporal confirmation. Normal image processing already does this automatically; use this only to replay pending or interrupted workflow work. Zero alert IDs is valid while confirmation is still building, and a replay must not duplicate observations, flags, occurrences, or alerts.
url: "{{baseUrl}}/api/analysis-runs/{{analysisRunId}}/evaluate-alerts"
method: POST
headers:
  Authorization: "Bearer {{firebaseIdToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('Analysis evaluated', () => pm.response.to.have.status(200));
      if (pm.response.code === 200) {
        const result = pm.response.json();
        const outcomes = Array.isArray(result.outcomes) ? result.outcomes : [];
        const observations = outcomes.filter((outcome) => outcome && outcome.observationId);
        const selectedObservation = observations.find((outcome) => outcome.positive) || observations[0];
        const flagIds = Array.isArray(result.flagIds) ? result.flagIds : [];
        const alertIds = Array.isArray(result.alertIds) ? result.alertIds : [];
        if (selectedObservation) pm.environment.set('issueObservationId', selectedObservation.observationId);
        else pm.environment.unset('issueObservationId');
        if (flagIds.length) pm.environment.set('flagId', flagIds[0]);
        else pm.environment.unset('flagId');
        if (alertIds.length) pm.environment.set('alertId', alertIds[0]);
        else pm.environment.unset('alertId');
        pm.test('Grouped temporal evaluation returned', () => {
          pm.expect(result.workflowVersion).to.be.a('string');
          pm.expect(result.policyVersion).to.be.a('string');
          pm.expect(result.observationCount).to.eql(outcomes.length);
          pm.expect(result.positiveObservationCount).to.be.at.most(result.observationCount);
          pm.expect(flagIds.length).to.eql(result.positiveObservationCount);
          pm.expect(alertIds).to.be.an('array');
          outcomes.forEach((outcome) => {
            pm.expect(outcome).to.include.all.keys(
              'issueType', 'observationId', 'positive', 'flagId',
              'alertId', 'temporalStatus', 'alreadyEvaluated'
            );
          });
        });
      }
    language: text/javascript
order: 2000
