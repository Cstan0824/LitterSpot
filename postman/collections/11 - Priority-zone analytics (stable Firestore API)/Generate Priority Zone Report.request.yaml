$kind: http-request
description: Generate and persist an explainable zone ranking for the selected start-inclusive/end-exclusive ISO range. A site with weak coverage correctly returns a 201 report whose status and zones are insufficient_data. Edit the two analytics period environment values to include your operational captures.
url: "{{baseUrl}}/api/analytics/reports"
method: POST
headers:
  Authorization: "Bearer {{firebaseIdToken}}"
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "siteId": "{{siteId}}",
      "periodStart": "{{analyticsPeriodStart}}",
      "periodEnd": "{{analyticsPeriodEnd}}"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Priority-zone report generated', () => pm.response.to.have.status(201));
      if (pm.response.code === 201) {
        const result = pm.response.json();
        const report = result.report;
        pm.test('Versioned report and active generation returned', () => {
          pm.expect(report.id).to.be.a('string').and.not.empty;
          pm.expect(report.siteId).to.eql(pm.environment.get('siteId'));
          pm.expect(['completed', 'insufficient_data']).to.include(report.status);
          pm.expect(report.policyVersion).to.eql('priority-zone-v1-provisional');
          pm.expect(report.aggregationVersion).to.eql('hourly-zone-v1');
          pm.expect(report.generationId).to.be.a('string').and.not.empty;
          pm.expect(['indexed', 'fallback_bounded_scan']).to.include(report.bucketQueryMode);
          pm.expect(report.policy.weights).to.eql({
            litterBurden: 0.35,
            visitorPressure: 0.30,
            overflowBurden: 0.25,
            issuePersistence: 0.10
          });
          pm.expect(report.policy.bands).to.eql({ highMinimum: 70, mediumMinimum: 40 });
          pm.expect(report.policy.sufficiency).to.eql({
            minimumSuccessfulHourlyBuckets: 8,
            minimumLocalCalendarDays: 2,
            minimumSampleSuccessRatio: 0.8
          });
        });
        pm.test('Every result is a zone-level explainable outcome', () => {
          pm.expect(result.zoneResults).to.be.an('array');
          result.zoneResults.forEach((zone) => {
            pm.expect(zone).to.include.all.keys(
              'zoneId', 'zoneName', 'rank', 'priorityBand', 'totalScore',
              'factors', 'evidence', 'coverage', 'reasons'
            );
            pm.expect(['high', 'medium', 'low', 'insufficient_data']).to.include(zone.priorityBand);
            pm.expect(zone.reasons).to.be.an('array').and.not.empty;
            pm.expect(zone.coverage.sufficient).to.be.a('boolean');
            if (zone.priorityBand === 'insufficient_data') {
              pm.expect(zone.rank).to.eql(null);
              pm.expect(zone.totalScore).to.eql(null);
            }
          });
        });
        pm.environment.set('analyticsReportId', report.id);
        pm.environment.set('analyticsGenerationId', report.generationId);
      }
    language: text/javascript
order: 2000

