$kind: http-request
description: Read one immutable report snapshot and its persisted zoneResults subcollection. Run Generate Priority Zone Report first so analyticsReportId is available.
url: "{{baseUrl}}/api/analytics/reports/{{analyticsReportId}}"
method: GET
headers:
  Authorization: "Bearer {{firebaseIdToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('Priority-zone report found', () => pm.response.to.have.status(200));
      if (pm.response.code === 200) {
        const result = pm.response.json();
        pm.test('Report detail matches the selected ID', () => {
          pm.expect(result.report.id).to.eql(pm.environment.get('analyticsReportId'));
          pm.expect(result.report.siteId).to.eql(pm.environment.get('siteId'));
          pm.expect(['completed', 'insufficient_data']).to.include(result.report.status);
          pm.expect(result.zoneResults).to.be.an('array');
          pm.expect(result.zoneResults.length).to.eql(result.report.zoneIds.length);
          result.zoneResults.forEach((zone) => {
            pm.expect(zone.reportId).to.eql(result.report.id);
            pm.expect(zone.siteId).to.eql(result.report.siteId);
          });
        });
      }
    language: text/javascript
order: 4000

