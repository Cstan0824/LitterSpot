$kind: http-request
description: Rebuild the selected site's operational runs and alert incidents into a bounded staging generation, then atomically publish it. Test/ineligible runs stay excluded. This changes Firestore analytics state and is intended for import, upgrade, or repair—not normal report polling.
url: "{{baseUrl}}/api/analytics/reconcile"
method: POST
headers:
  Authorization: "Bearer {{firebaseIdToken}}"
  Content-Type: application/json
body:
  type: json
  content: |-
    { "siteId": "{{siteId}}" }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Site analytics reconciled', () => pm.response.to.have.status(200));
      if (pm.response.code === 200) {
        const reconciliation = pm.response.json().reconciliation;
        pm.test('A complete hourly-zone generation was published', () => {
          pm.expect(reconciliation.siteId).to.eql(pm.environment.get('siteId'));
          pm.expect(reconciliation.generationId).to.be.a('string').and.not.empty;
          pm.expect(reconciliation.aggregationVersion).to.eql('hourly-zone-v1');
          pm.expect(reconciliation.includedRunCount).to.be.a('number').and.at.least(0);
          pm.expect(reconciliation.excludedRunCount).to.be.a('number').and.at.least(0);
          pm.expect(reconciliation.invalidRunCount).to.be.a('number').and.at.least(0);
          pm.expect(reconciliation.includedIncidentCount).to.be.a('number').and.at.least(0);
          pm.expect(reconciliation.excludedIncidentCount).to.be.a('number').and.at.least(0);
          pm.expect(reconciliation.bucketCount).to.be.a('number').and.at.least(0);
          pm.expect(reconciliation.sourceLimits).to.eql({
            runs: 5000,
            observations: 15001,
            alerts: 5000
          });
        });
        pm.environment.set('analyticsGenerationId', reconciliation.generationId);
      }
    language: text/javascript
order: 1000

