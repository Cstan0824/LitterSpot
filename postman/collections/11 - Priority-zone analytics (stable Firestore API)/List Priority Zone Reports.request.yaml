$kind: http-request
description: List the selected site's newest persisted analytics reports. nextCursor is a report document ID for the following page. The bounded fallback is explicit when the report-history index is not deployed.
url: "{{baseUrl}}/api/analytics/reports?siteId={{siteId}}&status=all&limit=20"
method: GET
headers:
  Authorization: "Bearer {{firebaseIdToken}}"
queryParams:
  siteId: "{{siteId}}"
  status: all
  limit: "20"
scripts:
  - type: afterResponse
    code: |-
      pm.test('Priority-zone reports listed', () => pm.response.to.have.status(200));
      if (pm.response.code === 200) {
        const result = pm.response.json();
        pm.test('Bounded report page returned', () => {
          pm.expect(result.reports).to.be.an('array');
          pm.expect(result.reports.length).to.be.at.most(20);
          pm.expect(result.nextCursor === null || typeof result.nextCursor === 'string').to.eql(true);
          pm.expect(['indexed', 'fallback_bounded_scan']).to.include(result.queryMode);
          result.reports.forEach((report) => {
            pm.expect(report.siteId).to.eql(pm.environment.get('siteId'));
            pm.expect(['pending', 'completed', 'insufficient_data', 'failed']).to.include(report.status);
          });
        });
        if (!pm.environment.get('analyticsReportId') && result.reports[0]) {
          pm.environment.set('analyticsReportId', result.reports[0].id);
        }
      }
    language: text/javascript
order: 3000

