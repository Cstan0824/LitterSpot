$kind: http-request
description: Export a completed or insufficient-data report as UTF-8 CSV with ranking, factor, evidence, coverage, and reason columns. Run Generate Priority Zone Report first.
url: "{{baseUrl}}/api/analytics/reports/{{analyticsReportId}}/csv"
method: GET
headers:
  Authorization: "Bearer {{firebaseIdToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('Priority-zone CSV exported', () => pm.response.to.have.status(200));
      if (pm.response.code === 200) {
        pm.test('CSV headers and attachment metadata returned', () => {
          pm.expect(pm.response.headers.get('Content-Type')).to.include('text/csv');
          pm.expect(pm.response.headers.get('Content-Disposition')).to.include(pm.environment.get('analyticsReportId'));
          pm.expect(pm.response.text()).to.include('"reportId","siteId","periodStart","periodEnd","zoneId","zoneName","rank","priorityBand","totalScore"');
        });
      }
    language: text/javascript
order: 5000

