$kind: http-request
description: Upload a JPEG, PNG, or WebP linked to an active Camera. isTest defaults to true and excludes this job from analytics. Reusing clientRequestId returns the original job instead of creating a duplicate.
url: "{{baseUrl}}/api/media/images"
method: POST
headers:
  Authorization: "Bearer {{firebaseIdToken}}"
body:
  type: formdata
  content:
    - type: file
      key: image
      src: []
    - type: text
      key: cameraId
      value: "{{cameraId}}"
    - type: text
      key: clientRequestId
      value: "{{clientRequestId}}"
    - type: text
      key: isTest
      value: "true"
    - type: text
      key: floorConfidence
      value: "0.25"
    - type: text
      key: binLocalizerConfidence
      value: "0.80"
scripts:
  - type: afterResponse
    code: |-
      pm.test('Upload created or reused', () => pm.expect([200, 201]).to.include(pm.response.code));
      if ([200, 201].includes(pm.response.code)) {
        const result = pm.response.json();
        pm.environment.set('mediaId', result.media.id);
        pm.environment.set('processingJobId', result.job.id);
      }
    language: text/javascript
order: 1000
