$kind: http-request
description: Get one media metadata record. The response exposes a protected content URL, never an absolute filesystem path.
url: "{{baseUrl}}/api/media/{{mediaId}}"
method: GET
headers:
  Authorization: "Bearer {{firebaseIdToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('Media found', () => pm.response.to.have.status(200));
      pm.test('Storage key is not exposed', () => pm.expect(pm.response.json().media).not.to.have.property('storageKey'));
    language: text/javascript
order: 3000
