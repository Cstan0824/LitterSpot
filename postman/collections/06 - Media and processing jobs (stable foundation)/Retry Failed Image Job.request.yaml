$kind: http-request
description: Reset a failed image job to queued and immediately process it. This intentionally returns 409 unless the selected job is failed.
url: "{{baseUrl}}/api/processing-jobs/{{processingJobId}}/retry"
method: POST
headers:
  Authorization: "Bearer {{firebaseIdToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('Retry processed or correctly rejected', () => pm.expect([200, 409]).to.include(pm.response.code));
      if (pm.response.code === 200) {
        const result = pm.response.json();
        pm.expect(result.job.status).to.eql('completed');
        pm.environment.set('analysisRunId', result.result.analysisRunId);
        if (result.result.detectionIds.length) pm.environment.set('detectionId', result.result.detectionIds[0]);
      }
    language: text/javascript
order: 8000
