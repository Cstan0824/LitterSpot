$kind: http-request
description: Authenticated access to the locally stored image bytes. A missing file marks the Firestore media record missing and returns 410.
url: "{{baseUrl}}/api/media/{{mediaId}}/content"
method: GET
headers:
  Authorization: "Bearer {{firebaseIdToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('Media content is available', () => pm.response.to.have.status(200));
      pm.test('Response is an image', () => pm.expect(pm.response.headers.get('Content-Type')).to.match(/^image\//));
    language: text/javascript
order: 4000
