$kind: http-request
name: Cleaner - Reject Work Order
description: Alternative to Accept. Run only on a newly assigned work order. Rejected work remains the active alert work record so the Supervisor/orchestrator can reassign it with complete history.
url: "{{baseUrl}}/api/cleaner/work-orders/{{workOrderId}}/reject"
method: POST
headers:
  Authorization: "Bearer {{cleanerFirebaseIdToken}}"
  Content-Type: application/json
body:
  type: json
  content: |-
    { "idempotencyKey": "postman-work-reject-001", "note": "Unable to access the area." }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Cleaner rejected newly assigned work', () => pm.response.to.have.status(200));
      if (pm.response.code === 200) pm.expect(pm.response.json().workOrder.status).to.eql('rejected');
    language: text/javascript
order: 4500
