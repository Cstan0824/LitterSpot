$kind: http-request
name: Cleaner - List My Work Orders
description: Cleaner-only queue. The server forces assignedCleanerId from the authenticated identity and ignores any attempt to view another Cleaner.
url: "{{baseUrl}}/api/cleaner/work-orders?status=active&limit=25"
method: GET
headers:
  Authorization: "Bearer {{cleanerFirebaseIdToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('Cleaner work queue returned', () => pm.response.to.have.status(200));
      if (pm.response.code === 200) {
        const result = pm.response.json();
        result.workOrders.forEach((work) => pm.expect(work.assignedCleanerId).to.eql(pm.environment.get('cleanerId')));
        if (result.workOrders[0]) pm.environment.set('workOrderId', result.workOrders[0].id);
      }
    language: text/javascript
order: 3000
