$kind: http-request
name: Require Rework
description: Supervisor override for ready_for_review to rework_required. Phase 14 will normally let the orchestrator issue this typed decision after evidence review.
url: "{{baseUrl}}/api/work-orders/{{workOrderId}}/status"
method: PATCH
headers:
  Authorization: "Bearer {{firebaseIdToken}}"
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "status": "rework_required",
      "idempotencyKey": "postman-work-rework-001",
      "note": "Some litter remains visible."
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Rework requested', () => pm.response.to.have.status(200));
      if (pm.response.code === 200) pm.expect(pm.response.json().workOrder.status).to.eql('rework_required');
    language: text/javascript
order: 7000
