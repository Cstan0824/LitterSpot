$kind: http-request
name: List Work Order History
description: Supervisor-only newest-first immutable transition history with actor role/ID, note, and opaque cursor.
url: "{{baseUrl}}/api/work-orders/{{workOrderId}}/history?limit=25"
method: GET
headers:
  Authorization: "Bearer {{firebaseIdToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('Immutable work history returned', () => pm.response.to.have.status(200));
      if (pm.response.code === 200) {
        const result = pm.response.json();
        pm.expect(result.history).to.be.an('array');
        result.history.forEach((item) => pm.expect(['cleaner', 'supervisor', 'orchestrator', 'system']).to.include(item.actorType));
      }
    language: text/javascript
order: 9000
