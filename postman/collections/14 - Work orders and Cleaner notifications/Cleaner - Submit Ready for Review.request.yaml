$kind: http-request
name: Cleaner - Submit Ready for Review
description: Cleaner-only in_progress to ready_for_review transition. This does not resolve the Phase 4 alert; Phase 14 will connect automated evidence review.
url: "{{baseUrl}}/api/cleaner/work-orders/{{workOrderId}}/ready-for-review"
method: POST
headers:
  Authorization: "Bearer {{cleanerFirebaseIdToken}}"
  Content-Type: application/json
body:
  type: json
  content: |-
    { "idempotencyKey": "postman-work-ready-001", "note": "Cleaning completed and ready for review." }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Work submitted for review', () => pm.response.to.have.status(200));
      if (pm.response.code === 200) pm.expect(pm.response.json().workOrder.status).to.eql('ready_for_review');
    language: text/javascript
order: 6000
