$kind: http-request
name: V2 Root - Phase 8 Take Over Work
description: Useful for orchestrated Work. Manually assigned Work is already in manual management mode, so this request is idempotent.
url: "{{baseUrl}}/api/work-orders/{{v2WorkOrderId}}/takeover"
method: POST
headers:
  Authorization: "Bearer {{v2RootToken}}"
  Content-Type: application/json
auth:
  type: noauth
body:
  type: json
  content: |-
    {"reason":"Supervisor is taking control for Postman testing.","idempotencyKey":"postman-v2-work-takeover-001"}
scripts:
  - type: afterResponse
    code: |-
      pm.test('Work is manually managed', () => { const work = pm.response.json().workOrder; pm.response.to.have.status(200); pm.expect(work.managementMode).to.eql('manual'); pm.environment.set('v2WorkRevision', String(work.revision)); });
    language: text/javascript
order: 22000
