$kind: http-request
name: V2 Cleaner - Phase 8 Submit for Review
url: "{{baseUrl}}/api/cleaner/work-orders/{{v2WorkOrderId}}/ready-for-review"
method: POST
headers:
  Authorization: "Bearer {{v2CleanerToken}}"
  Content-Type: application/json
auth:
  type: noauth
body:
  type: json
  content: |-
    {"idempotencyKey":"postman-v2-work-submit-001","completionEvidenceMediaId":"{{v2CompletionEvidenceMediaId}}"}
scripts:
  - type: afterResponse
    code: |-
      pm.test('Work awaits Supervisor review', () => { const work = pm.response.json().workOrder; pm.response.to.have.status(200); pm.expect(work.status).to.eql('awaiting_review'); pm.environment.set('v2WorkRevision', String(work.revision)); if (work.latestVerificationId) pm.environment.set('v2VerificationId', work.latestVerificationId); });
    language: text/javascript
order: 8000
