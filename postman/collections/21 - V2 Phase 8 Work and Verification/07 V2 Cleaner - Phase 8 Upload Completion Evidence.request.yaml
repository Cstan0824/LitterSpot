$kind: http-request
name: V2 Cleaner - Phase 8 Upload Completion Evidence
description: Select one genuine JPEG, PNG, or WebP in the photo row before sending.
url: "{{baseUrl}}/api/cleaner/work-orders/{{v2WorkOrderId}}/completion-evidence"
method: POST
headers:
  Authorization: "Bearer {{v2CleanerToken}}"
auth:
  type: noauth
body:
  type: formdata
  content:
    - type: file
      key: photo
      src: []
scripts:
  - type: afterResponse
    code: |-
      pm.test('Completion Evidence stored', () => pm.response.to.have.status(201));
      if (pm.response.code === 201) pm.environment.set('v2CompletionEvidenceMediaId', pm.response.json().evidence.mediaId);
    language: text/javascript
order: 7000
