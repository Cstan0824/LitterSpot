$kind: http-request
name: V2 Cleaner - Phase 8 Confirm Terminal History
url: "{{baseUrl}}/api/cleaner/work-orders?status=all"
method: GET
headers:
  Authorization: "Bearer {{v2CleanerToken}}"
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      pm.test('Resolved Work remains in Cleaner history', () => { const work = pm.response.json().workOrders.find(item => item.id === pm.environment.get('v2WorkOrderId')); pm.response.to.have.status(200); pm.expect(work).to.exist; pm.expect(work.status).to.eql('resolved'); });
    language: text/javascript
order: 13000
