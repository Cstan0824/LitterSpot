$kind: http-request
name: V2 Phase 8 Cleaner Login
url: https://identitytoolkit.googleapis.com/v1/accounts:signInWithPassword?key={{firebaseWebApiKey}}
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {"email":"{{v2CleanerEmail}}","password":"{{v2CleanerPassword}}","returnSecureToken":true}
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      pm.test('Cleaner login succeeds', () => pm.response.to.have.status(200));
      if (pm.response.code === 200) pm.environment.set('v2CleanerToken', pm.response.json().idToken);
    language: text/javascript
order: 4000
