$kind: http-request
name: V2 Root - Phase 8 Dismiss Work and Alert
description: Terminal optional test. Dismisses the Work and linked Alert and releases the Cleaner.
url: "{{baseUrl}}/api/work-orders/{{v2WorkOrderId}}/dismiss"
method: POST
headers:
  Authorization: "Bearer {{v2RootToken}}"
  Content-Type: application/json
auth:
  type: noauth
body:
  type: json
  content: |-
    {
      "reason":"Dismissed during Phase 8 Postman testing.",
      "expectedRevision":{{v2WorkRevision}},
      "idempotencyKey":"postman-v2-work-dismiss-001"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Work and linked Alert dismissed', () => { const work = pm.response.json().workOrder; pm.response.to.have.status(200); pm.expect(work.status).to.eql('dismissed'); pm.environment.set('v2WorkRevision', String(work.revision)); });
    language: text/javascript
order: 24000
