$kind: http-request
name: V2 Root - Phase 8 Reassign Work
description: Optional. Set v2ReplacementCleanerId to another active, scheduled and available V2 Cleaner.
url: "{{baseUrl}}/api/work-orders/{{v2WorkOrderId}}/reassign"
method: POST
headers:
  Authorization: "Bearer {{v2RootToken}}"
  Content-Type: application/json
auth:
  type: noauth
body:
  type: json
  content: |-
    {
      "assignedCleanerId":"{{v2ReplacementCleanerId}}",
      "reason":"Replacement Cleaner selected during Postman testing.",
      "expectedRevision":{{v2WorkRevision}},
      "idempotencyKey":"postman-v2-work-reassign-001"
    }
scripts:
  - type: beforeRequest
    code: |-
      if (!pm.environment.get('v2ReplacementCleanerId')) throw new Error('Set v2ReplacementCleanerId to another available Cleaner before sending.');
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test('Cleaner lock transferred', () => { const work = pm.response.json().workOrder; pm.response.to.have.status(200); pm.expect(work.assignedCleanerId).to.eql(pm.environment.get('v2ReplacementCleanerId')); pm.environment.set('v2WorkRevision', String(work.revision)); });
    language: text/javascript
order: 23000
