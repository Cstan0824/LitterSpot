$kind: http-request
name: V2 Root - Phase 8 Get Work
url: "{{baseUrl}}/api/work-orders/{{v2WorkOrderId}}"
method: GET
headers:
  Authorization: "Bearer {{v2RootToken}}"
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      pm.test('Supervisor sees awaiting Work', () => pm.response.to.have.status(200));
      if (pm.response.code === 200) { const work = pm.response.json().workOrder; pm.environment.set('v2WorkRevision', String(work.revision)); if (work.latestVerificationId) pm.environment.set('v2VerificationId', work.latestVerificationId); }
    language: text/javascript
order: 9000
