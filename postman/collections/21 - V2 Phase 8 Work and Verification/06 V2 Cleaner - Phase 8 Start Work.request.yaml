$kind: http-request
name: V2 Cleaner - Phase 8 Start Work
url: "{{baseUrl}}/api/cleaner/work-orders/{{v2WorkOrderId}}/start"
method: POST
headers:
  Authorization: "Bearer {{v2CleanerToken}}"
  Content-Type: application/json
auth:
  type: noauth
body:
  type: json
  content: |-
    {"idempotencyKey":"postman-v2-work-start-001"}
scripts:
  - type: afterResponse
    code: |-
      pm.test('Work moved to in progress', () => { pm.response.to.have.status(200); pm.expect(pm.response.json().workOrder.status).to.eql('in_progress'); });
    language: text/javascript
order: 6000
