$kind: http-request
name: V2 Root - Phase 8 List Cleaners
url: "{{baseUrl}}/api/cleaners?status=active"
method: GET
headers:
  Authorization: "Bearer {{v2RootToken}}"
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      pm.test('At least one active Cleaner exists', () => { pm.response.to.have.status(200); pm.expect(pm.response.json().cleaners.length).to.be.above(0); });
      if (pm.response.code === 200) {
        const available = pm.response.json().cleaners.find(item => item.availability?.available) || pm.response.json().cleaners[0];
        if (available) pm.environment.set('v2CleanerId', available.id);
      }
    language: text/javascript
order: 2000
