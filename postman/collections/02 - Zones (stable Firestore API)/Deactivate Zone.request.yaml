$kind: http-request
description: Soft-deactivates only after active cameras and assigned active cleaners are handled.
url: "{{baseUrl}}/api/zones/{{zoneId}}"
method: DELETE
headers:
  Authorization: "Bearer {{firebaseIdToken}}"
scripts:
  - type: afterResponse
    code: pm.test('Zone deactivated or correctly blocked', () => pm.expect([200, 409]).to.include(pm.response.code));
    language: text/javascript
order: 5000
