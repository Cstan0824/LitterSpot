$kind: http-request
description: Requires an active site and saves the returned ID into zoneId.
url: "{{baseUrl}}/api/zones"
method: POST
headers:
  Authorization: "Bearer {{firebaseIdToken}}"
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "siteId": "{{siteId}}",
      "name": "Postman Test Zone",
      "code": "POSTMAN_ZONE",
      "description": "API testing zone"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Zone created', () => pm.response.to.have.status(201));
      if (pm.response.code === 201) pm.environment.set('zoneId', pm.response.json().zone.id);
    language: text/javascript
order: 2000
