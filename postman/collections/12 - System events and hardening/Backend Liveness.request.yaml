$kind: http-request
name: Backend Liveness
description: Public process liveness. A successful response means the Node process can answer HTTP; it does not claim that FastAPI or Firestore is ready.
url: "{{baseUrl}}/api/health/live"
method: GET
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      pm.test('Backend process is live', () => pm.response.to.have.status(200));
      if (pm.response.code === 200) {
        pm.expect(pm.response.json()).to.eql({ status: 'ok' });
        pm.expect(pm.response.headers.get('X-Request-ID')).to.be.a('string').and.not.empty;
        pm.expect(pm.response.headers.get('X-Content-Type-Options')).to.eql('nosniff');
        pm.expect(pm.response.headers.has('X-Powered-By')).to.eql(false);
      }
    language: text/javascript
order: 1000
