$kind: http-request
name: Enable Camera
description: Sets deliberate monitoring state. An open Supervisor console starts capture. Run Live Camera Configuration first to refresh the revision.
url: "{{baseUrl}}/api/camera-creation/cameras/{{v2CameraId}}/monitoring"
method: PATCH
headers:
  Authorization: "Bearer {{v2RootToken}}"
  Content-Type: application/json
auth:
  type: noauth
body:
  type: json
  content: '{"monitoringEnabled":true,"expectedRevision":{{v2CameraRevision}}}'
scripts:
  - type: afterResponse
    code: |-
      pm.test('Camera enabled', () => pm.response.to.have.status(200));
      if (pm.response.code === 200) pm.environment.set('v2CameraRevision', String(pm.response.json().revision));
    language: text/javascript
order: 2000
