$kind: http-request
name: Select Clean Scene
description: Selects the previously uploaded clean scene. The browser feed changes while episode, sequence, Alerts and Work remain continuous.
url: "{{baseUrl}}/api/development/cameras/{{v2CameraId}}/scenes/clean/select"
method: POST
headers:
  Authorization: "Bearer {{v2RootToken}}"
auth:
  type: noauth
order: 5000
