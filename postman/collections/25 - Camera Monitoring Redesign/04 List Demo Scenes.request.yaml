$kind: http-request
name: List Demo Scenes
description: Requires CAMERA_DEMO_SCENES_ENABLED=true in development. Set v2CameraId to a looped-video Camera. Upload scenes using npm run demo:camera-scene with --upload.
url: "{{baseUrl}}/api/development/cameras/{{v2CameraId}}/scenes"
method: GET
headers:
  Authorization: "Bearer {{v2RootToken}}"
auth:
  type: noauth
order: 4000
