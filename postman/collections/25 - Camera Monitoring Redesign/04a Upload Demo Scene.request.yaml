$kind: http-request
name: Upload Demo Scene
description: Set cameraSceneKey to clean or dirty, select its video file, and send once per scene. Use a new key for a replacement clip. Exact Registration dimensions and the same physical viewpoint are required.
url: "{{baseUrl}}/api/development/cameras/{{v2CameraId}}/scenes/{{cameraSceneKey}}"
method: POST
headers:
  Authorization: "Bearer {{v2RootToken}}"
auth:
  type: noauth
body:
  type: formdata
  content:
    - type: file
      key: video
      src: []
      disabled: false
order: 4500
