$kind: http-request
name: V2 Superadmin - Phase 10 Reactivate Test Site
description: Optional destructive development test. Deactivation dismisses active Alerts and Work and cannot be undone by reactivation. Never run against the teammates' shared project.
url: "{{baseUrl}}/api/superadmin/sites/{{v2SiteId}}/status"
method: PATCH
headers:
  Authorization: "Bearer {{v2SuperadminToken}}"
  Content-Type: application/json
auth:
  type: noauth
body:
  type: json
  content: |-
    {"status":"active","reason":"Phase 10 development test complete"}
scripts:
  - type: beforeRequest
    code: |-
      if (pm.environment.get('allowSiteDeactivationTest') !== 'true') throw new Error('Read the Phase 10 brief and set allowSiteDeactivationTest=true only for your isolated development Site.');
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test('Operation succeeds', () => pm.response.to.have.status(200));
      if (pm.response.code === 200) { pm.expect(pm.response.json().site.status).to.eql('active'); }
    language: text/javascript
order: 13000
