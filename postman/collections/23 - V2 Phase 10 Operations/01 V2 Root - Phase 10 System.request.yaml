$kind: http-request
name: V2 Root - Phase 10 System
url: "{{baseUrl}}/api/operations/v2/system"
method: GET
headers:
  Authorization: "Bearer {{v2RootToken}}"
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      pm.test('Request succeeds', () => { pm.response.to.have.status(200); const body = pm.response.json(); pm.expect(body.runtime.backgroundWorkerEnabled).to.be.a('boolean'); });
    language: text/javascript
order: 1000
