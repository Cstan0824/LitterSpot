$kind: http-request
name: V2 Cleaner - Phase 10 Notifications
url: "{{baseUrl}}/api/cleaner/notifications"
method: GET
headers:
  Authorization: "Bearer {{v2CleanerToken}}"
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      pm.test('Request succeeds', () => { pm.response.to.have.status(200); const body = pm.response.json(); pm.expect(body.notifications).to.be.an('array'); });
    language: text/javascript
order: 4000
