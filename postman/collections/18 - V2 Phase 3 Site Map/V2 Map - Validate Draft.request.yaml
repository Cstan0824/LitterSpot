$kind: http-request
name: V2 Map - Validate Draft
url: "{{baseUrl}}/api/site-map/draft/validate"
method: POST
headers:
  Authorization: "Bearer {{v2RootToken}}"
  Content-Type: application/json
auth:
  type: noauth
body:
  type: json
  content: '{}'
scripts:
  - type: afterResponse
    code: |-
      pm.test('Draft validates', () => { pm.response.to.have.status(200); pm.expect(pm.response.json()).to.eql({valid:true, errors:[]}); });
    language: text/javascript
order: 3000
