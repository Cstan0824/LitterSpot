$kind: http-request
name: V2 Map - Get Active Map
url: "{{baseUrl}}/api/site-map"
method: GET
headers:
  Authorization: "Bearer {{v2RootToken}}"
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      pm.test('Active Site Map returned', () => pm.response.to.have.status(200));
      if (pm.response.code === 200) pm.environment.set('v2ActiveMapRevisionId', pm.response.json().map.activeRevisionId);
    language: text/javascript
order: 1000
