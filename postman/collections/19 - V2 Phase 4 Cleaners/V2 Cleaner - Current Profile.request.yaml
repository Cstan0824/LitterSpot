$kind: http-request
name: V2 Cleaner - Current Profile
url: "{{baseUrl}}/api/cleaner/me"
method: GET
headers:
  Authorization: "Bearer {{v2CleanerToken}}"
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      pm.test('Cleaner sees own V2 profile', () => { pm.response.to.have.status(200); pm.expect(pm.response.json().cleaner.id).to.eql(pm.environment.get('v2CleanerId')); });
    language: text/javascript
order: 6000
