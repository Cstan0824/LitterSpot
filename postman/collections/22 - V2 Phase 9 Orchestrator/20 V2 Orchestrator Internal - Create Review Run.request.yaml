$kind: http-request
name: V2 Orchestrator Internal - Create Review Run
description: v2WorkOrderId must identify orchestrated Alert Work that is awaiting review.
url: "{{baseUrl}}/internal/orchestrator/v2/review-runs"
method: POST
headers:
  X-Orchestrator-Token: "{{orchestratorInternalToken}}"
  X-Orchestrator-Worker-ID: "{{orchestratorWorkerId}}"
  Content-Type: application/json
auth:
  type: noauth
body:
  type: json
  content: |-
    {"siteId":"{{v2SiteId}}","workOrderId":"{{v2WorkOrderId}}","triggerType":"postman_review_test"}
scripts:
  - type: afterResponse
    code: |-
      pm.test('Leased review Run created', () => pm.response.to.have.status(201));
      if (pm.response.code === 201) pm.environment.set('v2OrchestratorReviewRunId', pm.response.json().runId);
    language: text/javascript
order: 20000
