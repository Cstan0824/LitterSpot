$kind: http-request
name: V2 Orchestrator Internal - Get Assignment Context
url: "{{baseUrl}}/internal/orchestrator/v2/runs/{{v2OrchestratorRunId}}/assignment-context?siteId={{v2SiteId}}"
method: GET
headers:
  X-Orchestrator-Token: "{{orchestratorInternalToken}}"
  X-Orchestrator-Worker-ID: "{{orchestratorWorkerId}}"
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      pm.test('Context contains eligible Alert and Cleaner pairs', () => { const context = pm.response.json().context; pm.response.to.have.status(200); pm.expect(context.alerts.length).to.be.at.most(10); pm.expect(context.eligiblePairs.length).to.be.above(0); });
      if (pm.response.code === 200 && pm.response.json().context.eligiblePairs[0]) { const pair = pm.response.json().context.eligiblePairs[0]; pm.environment.set('v2OrchestratorAssignmentAlertId', pair.alertId); pm.environment.set('v2OrchestratorAssignmentCleanerId', pair.cleanerId); }
    language: text/javascript
order: 11000
