$kind: http-request
name: V2 Orchestrator Internal - Create Assignment Run
url: "{{baseUrl}}/internal/orchestrator/v2/assignment-runs"
method: POST
headers:
  X-Orchestrator-Token: "{{orchestratorInternalToken}}"
  X-Orchestrator-Worker-ID: "{{orchestratorWorkerId}}"
  Content-Type: application/json
auth:
  type: noauth
body:
  type: json
  content: |-
    {"siteId":"{{v2SiteId}}","triggerType":"postman_internal_test"}
scripts:
  - type: afterResponse
    code: |-
      pm.test('Leased V2 assignment Run created', () => pm.response.to.have.status(201));
      if (pm.response.code === 201) pm.environment.set('v2OrchestratorRunId', pm.response.json().runId);
    language: text/javascript
order: 10000
