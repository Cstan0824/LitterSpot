$kind: http-request
name: V2 Root - Phase 9 Resume Orchestrator
url: "{{baseUrl}}/api/orchestrator/v2/status"
method: POST
headers:
  Authorization: "Bearer {{v2RootToken}}"
  Content-Type: application/json
auth:
  type: noauth
body:
  type: json
  content: |-
    {"status":"running","reason":null}
scripts:
  - type: afterResponse
    code: |-
      pm.test('Orchestrator is running', () => { pm.response.to.have.status(200); pm.expect(pm.response.json().config.status).to.eql('running'); });
    language: text/javascript
order: 4000
