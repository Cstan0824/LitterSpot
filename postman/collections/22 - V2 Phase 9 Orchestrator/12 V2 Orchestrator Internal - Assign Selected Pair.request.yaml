$kind: http-request
name: V2 Orchestrator Internal - Assign Selected Pair
url: "{{baseUrl}}/internal/orchestrator/v2/runs/{{v2OrchestratorRunId}}/assign-cleaner"
method: POST
headers:
  X-Orchestrator-Token: "{{orchestratorInternalToken}}"
  X-Orchestrator-Worker-ID: "{{orchestratorWorkerId}}"
  Content-Type: application/json
auth:
  type: noauth
body:
  type: json
  content: |-
    {"siteId":"{{v2SiteId}}","alertId":"{{v2OrchestratorAssignmentAlertId}}","cleanerId":"{{v2OrchestratorAssignmentCleanerId}}","rationaleSummary":"Postman selected one pair returned by the trusted context."}
scripts:
  - type: afterResponse
    code: |-
      pm.test('Selected pair creates orchestrated Work', () => { const work = pm.response.json().workOrder; pm.response.to.have.status(201); pm.expect(work.managementMode).to.eql('orchestrated'); pm.expect(work.status).to.eql('assigned'); });
      if (pm.response.code === 201) pm.environment.set('v2WorkOrderId', pm.response.json().workOrder.id);
    language: text/javascript
order: 12000
