$kind: http-request
name: V2 Root - Phase 9 Create Simulated Alert
description: Development-only Root helper. Creates real workflow records and queues the Orchestrator without AI inference. Same request ID and body replays the same Alert. For a new Alert, close the previous Alert/Work and change v2TestAlertRequestId. No evidence image is generated. Set ORCHESTRATOR_WORKER_ENABLED=false and restart Node if you want to trigger the model manually in request 06.
url: "{{baseUrl}}/api/test-support/v2/alerts"
method: POST
headers:
  Authorization: "Bearer {{v2RootToken}}"
  Content-Type: application/json
auth:
  type: noauth
body:
  type: json
  content: |-
    {
      "cameraId": "{{v2TestCameraId}}",
      "issueType": "floor_litter",
      "condition": "litter",
      "severity": "warning",
      "confidence": 0.99,
      "clientRequestId": "{{v2TestAlertRequestId}}"
    }
scripts:
  - type: beforeRequest
    code: |-
      if (!pm.environment.get('v2TestCameraId')) throw new Error('Run 05a and select an active V2 Camera first.');
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test('Simulated Alert is persisted', () => {
        pm.response.to.have.status(201);
        const body = pm.response.json();
        pm.expect(body.alert.isSimulation).to.eql(true);
        pm.expect(body.flag.alertId).to.eql(body.alert.id);
      });
      if (pm.response.code === 201) {
        pm.environment.set('v2AlertId', pm.response.json().alert.id);
        pm.environment.set('v2OrchestratorAssignmentAlertId', pm.response.json().alert.id);
      }
    language: text/javascript
order: 5600
