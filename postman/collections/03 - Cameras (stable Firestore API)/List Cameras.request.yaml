$kind: http-request
url: "{{baseUrl}}/api/cameras?status=all&zoneId={{zoneId}}"
method: GET
headers:
  Authorization: "Bearer {{firebaseIdToken}}"
queryParams:
  status: all
  zoneId: "{{zoneId}}"
scripts:
  - type: afterResponse
    code: pm.test('Cameras returned', () => pm.response.to.have.status(200));
    language: text/javascript
order: 1000
