$kind: http-request
name: Cleaner Submit Ready for Review
description: Submit cleaner evidence for verification. This moves the work order to ready_for_review and the alert to awaiting_verification; it never resolves the alert.
url: "{{baseUrl}}/api/cleaner/work-orders/{{workOrderId}}/ready-for-review"
method: POST
headers:
  Authorization: "Bearer {{cleanerFirebaseIdToken}}"
  Content-Type: application/json
body:
  type: json
  content: |- 
    {
      "idempotencyKey": "{{reviewSubmissionIdempotencyKey}}",
      "note": "Cleaner submitted final evidence for verification.",
      "evidenceMediaIds": ["{{reviewEvidenceMediaId}}"]
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Cleaner submission succeeds or replays', () => pm.expect([200, 201]).to.include(pm.response.code));
      if ([200, 201].includes(pm.response.code)) {
        const result = pm.response.json();
        pm.expect(result.workOrder.status).to.eql('ready_for_review');
        pm.expect(result.alertId).to.eql(pm.variables.get('alertId'));
        if (result.reviewRequest?.id) pm.environment.set('reviewRequestId', result.reviewRequest.id);
      }
    language: text/javascript
order: 1100
