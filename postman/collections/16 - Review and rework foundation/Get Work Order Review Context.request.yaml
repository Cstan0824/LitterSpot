$kind: http-request
name: Get Work Order Review Context
description: Supervisor read model containing the work order, durable review requests, and immutable review attempts.
url: "{{baseUrl}}/api/work-orders/{{workOrderId}}/reviews"
method: GET
headers:
  Authorization: "Bearer {{firebaseIdToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('Review context is readable', () => pm.response.to.have.status(200));
      if (pm.response.code === 200) {
        const result = pm.response.json();
        pm.expect(result.workOrder.id).to.eql(pm.variables.get('workOrderId'));
        if (result.reviewRequests?.[0]?.id) pm.environment.set('reviewRequestId', result.reviewRequests[0].id);
      }
    language: text/javascript
order: 1110
