$kind: http-request
url: "{{baseUrl}}/api/cleaners?status=all"
method: GET
headers:
  Authorization: "Bearer {{firebaseIdToken}}"
queryParams:
  status: all
scripts:
  - type: afterResponse
    code: pm.test('Cleaners returned', () => pm.response.to.have.status(200));
    language: text/javascript
order: 1000
