$kind: http-request
description: Creates a non-login personnel record. Change cleanerStaffCode before rerunning because codes remain reserved.
url: "{{baseUrl}}/api/cleaners"
method: POST
headers:
  Authorization: "Bearer {{firebaseIdToken}}"
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "staffCode": "{{cleanerStaffCode}}",
      "fullName": "Postman Test Cleaner",
      "phone": "+60 12-345 6789",
      "assignedZoneId": "{{zoneId}}",
      "notes": "Created during API testing"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Cleaner created', () => pm.response.to.have.status(201));
      if (pm.response.code === 201) pm.environment.set('cleanerId', pm.response.json().cleaner.id);
    language: text/javascript
order: 2000
