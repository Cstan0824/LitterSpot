$kind: http-request
url: "{{baseUrl}}/api/cleaners/{{cleanerId}}"
method: PATCH
headers:
  Authorization: "Bearer {{firebaseIdToken}}"
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "phone": "+60 11-2222 3333",
      "notes": "Updated through Postman"
    }
scripts:
  - type: afterResponse
    code: pm.test('Cleaner updated', () => pm.response.to.have.status(200));
    language: text/javascript
order: 4000
