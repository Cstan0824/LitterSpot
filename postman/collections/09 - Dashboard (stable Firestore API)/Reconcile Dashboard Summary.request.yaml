$kind: http-request
description: Explicitly rebuild the selected site's dashboardSummaries read-model document from authoritative cameras, current grouped-temporal-v2 alerts, detections, and failed jobs. This is an authenticated maintenance write, not part of normal dashboard polling.
url: "{{baseUrl}}/api/dashboard/reconcile"
method: POST
headers:
  Authorization: "Bearer {{firebaseIdToken}}"
  Content-Type: application/json
body:
  type: json
  content: |-
    { "siteId": "{{siteId}}" }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Dashboard summary reconciled', () => pm.response.to.have.status(200));
      if (pm.response.code === 200) {
        const summary = pm.response.json().summary;
        pm.test('Stable reconciled summary returned', () => {
          pm.expect(summary).to.be.an('object');
          pm.expect(summary.id).to.eql(pm.environment.get('siteId'));
          pm.expect(summary.siteId).to.eql(pm.environment.get('siteId'));
          pm.expect(summary.version).to.eql('site-dashboard-summary-v1');
          pm.expect(summary.workflowVersion).to.eql('grouped-temporal-v2');
          pm.expect(summary.activeAlertCounts).to.include.all.keys(
            'new', 'acknowledged', 'inProgress', 'total'
          );
          pm.expect(summary.configuredCameraCount).to.be.a('number');
          pm.expect(summary.resolvedAlertCount).to.be.a('number');
          pm.expect(summary.reconciledAt).to.be.a('string');
          pm.expect(summary.updatedAt).to.be.a('string');
        });
      }
    language: text/javascript
order: 2000
